name: Ledger contribution
description: Propose a claim, correction, decision, or result for the ARIADNE ledger.
title: "[Ledger]: "
labels:
  - ledger-contribution
body:
  - type: markdown
    attributes:
      value: |
        Use this form for public contributions to the provenance ledger. Do not include confidential, personal, restricted, or embargoed information. Submitting an entry does not make it an approved decision.

  - type: input
    id: title
    attributes:
      label: Short title
      placeholder: "Example: Add workshop programme evidence"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: When did the event happen? Use YYYY-MM-DD, or YYYY-MM-DD to YYYY-MM-DD for several days. If left blank, the date this issue was opened is used.
      placeholder: "Example: 2026-09-01 to 2026-09-04"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Entry type
      options:
        - Observed
        - User-reported
        - Proposal
        - Decision
        - Result
        - Correction
    validations:
      required: true

  - type: textarea
    id: claim
    attributes:
      label: Claim
      description: State one clear claim or requested correction.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add a public link, repository path, meeting record, or state that evidence is pending.
    validations:
      required: true

  - type: input
    id: supersedes
    attributes:
      label: Supersedes
      description: For a correction, give the date and title of the earlier ledger entry it corrects. Leave blank otherwise.
      placeholder: "Example: 2026-09-08 - Pilot direction proposed"
    validations:
      required: false

  - type: checkboxes
    id: public-content
    attributes:
      label: Public-content confirmation
      options:
        - label: I confirm that this submission contains no confidential, personal, restricted, or embargoed information.
          required: true